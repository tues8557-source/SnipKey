name: iOS Build

on:
  push:
    branches:
      - dev/clipboard-keyboard
      - dev/personal-team-test
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project SnipKey.xcodeproj \
            -scheme SnipKey \
            -resolvePackageDependencies

      - name: Build app and keyboard extension
        run: |
          set -o pipefail
          xcodebuild \
            -project SnipKey.xcodeproj \
            -scheme SnipKey \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build
